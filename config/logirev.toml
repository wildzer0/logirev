# =============================================================================
#  logirev configuration
# =============================================================================
#
#  Lines starting with "#" are comments and are ignored.
#  Changes are applied automatically a couple of seconds after you save the
#  file (except the log file and capture settings, which need a restart).
#  If the file contains a mistake, the previous settings stay active and the
#  error is written to the log.
#
#  Tip: run "logirevctl scan" to see the exact name of your device and the list
#  of buttons that can be remapped on it.

# -----------------------------------------------------------------------------
#  General
# -----------------------------------------------------------------------------
[general]
# Which receivers / devices to use. "auto" uses all of them (several receivers
# can be plugged in at the same time). To use only one kind, write its USB
# product id, e.g. "c548" for Bolt or "c52b" for Unifying.
product_id = "auto"

# Show a notification when a battery drops to this percentage (0 = never).
battery_warning = 15

# Look for a new version of logirev on GitHub once a day (true / false).
check_updates = true

# -----------------------------------------------------------------------------
#  Logging
# -----------------------------------------------------------------------------
[logging]
# How much detail to write: "error", "warn", "info", "debug" or "trace".
# "trace" also writes every single HID++ packet (useful for bug reports).
level = "info"

# Log file, next to this configuration file. It never grows beyond max_size:
# when full it is renamed to "logirev.1.log" and a new one is started.
file = "logirev.log"
max_size = 1048576            # 1 MiB

# Optional capture of all HID++ traffic, readable with Wireshark.
# Remove the "#" in front of the next line to enable it.
# pcap = "logirev.pcap"
pcap_max_size = 10485760      # 10 MiB

# -----------------------------------------------------------------------------
#  Device profiles
# -----------------------------------------------------------------------------
#
#  Each [[profile]] block describes how to configure one kind of device.
#  When a device connects, the FIRST profile whose "match" fits is used.
#
#  match = { name = "...", kind = "..." }
#      name : text contained in the device name (upper/lower case ignored)
#      kind : mouse, trackball, keyboard, trackpad, presenter, ...
#      Leave out "match" to make a profile that fits every device.
#
#  Settings (all optional; leave one out to keep the device's own value).
#  "logirevctl scan" shows which ones your device has and their values.
#      dpi           = 1600    # sensor resolution / speed
#      pointer_speed = 1.0     # 0.18 .. 2.00, 1.0 = normal (only some devices)
#      hires_wheel   = false   # high-resolution scrolling (see the docs first!)
#      invert_wheel  = false   # reverse the scroll direction
#      smartshift    = { mode = "smart", threshold = 10 }  # or "ratchet", "free" (MX Master)
#      thumb_wheel_invert = false   # reverse the thumb wheel (MX Master)
#      report_rate   = 1000    # Hz, gaming mice only
#      function_keys = "standard"   # keyboards: "standard" F1..F12, or "special" (media)
#      disable_keys  = ["capslock", "insert"]   # keyboards: capslock, numlock,
#                                               # scrolllock, insert, windows
#      backlight     = { mode = "manual", level = 3 }  # backlit keyboards:
#                                               # "off", "on", "auto", "manual"
#
#  Buttons: one line per button you want to change, in the [profile.buttons]
#  part. Button names: left, right, middle, back, forward, tilt_left,
#  tilt_right, precision (= dpi_switch), gesture, smartshift -- or the numeric
#  id shown by "logirevctl scan", written in quotes: "0x53" = { ... }
#
#      { action = "keys", keys = "Ctrl+C" }            press a shortcut
#      { action = "click", button = "middle" }         left/right/middle/back/forward
#      { action = "scroll", direction = "left", amount = 1 }   up/down/left/right
#      { action = "command", command = "calc.exe" }    start a program
#      { action = "command", command = "notepad.exe", args = ["C:\\notes.txt"] }
#      { action = "toggle-dpi", dpi = 400 }            slow mode on/off (DPI)
#      { action = "toggle-pointer-speed", speed = 0.4 }  slow mode (pointer speed)
#      { action = "cycle-dpi", dpi = [400, 800, 1600] }  next DPI at each press
#      { action = "change-host", host = "next" }       Easy-Switch: 1, 2, 3 or "next"
#      { action = "change-host", host = 2, all = true }  every device to computer 2
#      { action = "brightness", change = 10 }          screen brighter (-10 = darker)
#      { action = "brightness", set = 50 }             screen at 50 %
#      { action = "backlight", change = "up" }         keyboard light: up/down/toggle
#      { action = "macro", name = "signature" }        a macro from [macros] below
#      { action = "macro", name = "spam", repeat = 100 }  ...repeated while held
#      { action = "sequence", steps = [ { keys = "Ctrl+A" }, { delay = 100 }, { text = "Hi" } ] }
#                                                      several steps (simple macro)
#      gestures (hold the button and move; buttons marked "gestures" by scan):
#      [profile.buttons.gesture]
#      action = "gesture"
#      up    = { action = "keys", keys = "Super+Tab" }
#      down  = { action = "keys", keys = "Super+D" }
#      left  = { action = "keys", keys = "Ctrl+Super+Left" }
#      right = { action = "keys", keys = "Ctrl+Super+Right" }
#      click = { action = "click", button = "middle" }
#  (a "{ ... }" group must stay on ONE line; for long ones use a block like
#  the gesture above. Full details in docs/CONFIGURATION.md)
#      { action = "disable" }                          the button does nothing
#      { action = "default" }                          normal behaviour
#
#  Per-program buttons (Windows): after [profile.buttons] add one or more
#      [[profile.app]]
#      match = ["chrome.exe", "msedge.exe"]
#      buttons.tilt_left = { action = "keys", keys = "Ctrl+Shift+Tab" }
#  While one of those programs is in front, its buttons replace the profile's
#  ("default" there means: normal behaviour in that program).
#
#  Key names: Ctrl, Shift, Alt, Super (= Windows key), A..Z, 0..9, F1..F24,
#  Enter, Escape, Tab, Space, Backspace, Delete, Insert, Home, End, PageUp,
#  PageDown, Left, Right, Up, Down, PrintScreen, VolumeUp, VolumeDown,
#  VolumeMute, MediaPlayPause, MediaNext, MediaPrevious, BrowserBack,
#  BrowserForward, Calculator, ... (full list in docs/CONFIGURATION.md).

# -----------------------------------------------------------------------------
#  Macros: named lists of steps, used with { action = "macro", name = "..." }
# -----------------------------------------------------------------------------
#  Steps: { keys = "Ctrl+C" }  { press = "Shift" }  { release = "Shift" }
#         { text = "Hello" }   { click = "left" }   { delay = 100 }  (ms)
#  Example (remove the "#" to use it):
# [macros.signature]
# steps = [ { text = "Best regards," }, { keys = "Enter" }, { text = "Your Name" } ]

# --- Logitech MX Ergo S (and MX Ergo) trackball ------------------------------
# The MX Ergo S changes speed through its DPI (sensor resolution). Remove the
# "#" below to force a resolution; otherwise the device keeps its own.
[[profile]]
name = "MX Ergo"
match = { name = "MX Ergo", kind = "trackball" }
# dpi = 750

[profile.buttons]
back       = { action = "keys", keys = "Alt+Left" }      # browser back
forward    = { action = "keys", keys = "Alt+Right" }     # browser forward
tilt_left  = { action = "keys", keys = "Ctrl+Shift+Tab" } # previous tab
tilt_right = { action = "keys", keys = "Ctrl+Tab" }       # next tab
# The button below the wheel: slow mode for precise work. Use
# { action = "default" } instead to keep the device's built-in behaviour.
precision  = { action = "toggle-dpi", dpi = 400 }
middle     = { action = "default" }

# Example: in File Explorer the side buttons go up a folder / scroll sideways.
# Remove the "#" at the start of the next lines to try it.
# [[profile.app]]
# match = ["explorer.exe"]
# buttons.back = { action = "keys", keys = "Alt+Up" }
# buttons.tilt_left = { action = "scroll", direction = "left", amount = 3 }
# buttons.tilt_right = { action = "scroll", direction = "right", amount = 3 }

# --- Keyboards --------------------------------------------------------------
[[profile]]
name = "Keyboard"
match = { kind = "keyboard" }
# function_keys = "standard"
# disable_keys = ["capslock"]

# --- Any other mouse or trackball -------------------------------------------
[[profile]]
name = "Generic pointing device"
match = { kind = "mouse" }

[profile.buttons]
back    = { action = "default" }
forward = { action = "default" }
