[package]
name = "logirev"
version = "1.4.0-rc.1"
edition = "2021"
rust-version = "1.95"
description = "Portable background daemon that configures Logitech HID++ devices (Bolt / Unifying receivers) without Logi Options+"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/wildzer0/logirev"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

# The settings window (optional: the service runs without it).
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11"] }

[features]
default = ["gui"]
# Build the settings window into `logirev` (`logirev --settings`).
gui = ["dep:eframe"]
# Development only: `EFRAME_SCREENSHOT_TO=x.png` saves the window and exits.
screenshot = ["gui", "eframe/__screenshot"]

# Pure-Rust HID backends on every platform: no C toolchain, no system
# libraries at runtime, so the produced binary is a single portable file.
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Windows only: compiles the icon into the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
