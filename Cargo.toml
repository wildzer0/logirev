[package]
name = "logirev"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Portable background daemon that configures Logitech HID++ devices (Bolt / Unifying receivers) without Logi Options+"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/wildzer0/logirev"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Pure-Rust HID backends on every platform: no C toolchain, no system
# libraries at runtime, so the produced binary is a single portable file.
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
